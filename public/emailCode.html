<!DOCTYPE html>

<body>
    <main class="p-4 ">

            <!-- input -->
                <div class="flex justify-between mx-5">

            </div>
            <!--todo send button  -->
            <button data-btn="confirmOTP" type="button" class="text-white text-center py-[15px] bg-gradient-to-r from-[#8B302D] to-[#3A2625] w-full rounded-[30px] capitalize cursor-pointer">confirm</button>
            <input data-opt="test" type="text" class="border">
