<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sett new password</title>
    <link rel="stylesheet" href="../build/input.css">
</head>
<body>
    <main class="p-4">
        <form action="">
            <!-- todo header -->
            <div class="mb-[85px] text-center " >
                <p >new password</p>
            </div>
            <!-- input -->
            <div>
                <div class="mb-6">
                    <label class="label" for="newPassword">enter new password</label>
                    <input id="newPassword" type="text" class="w-full rounded-[30px] pl-[29px] pt-[17px] pb-[18px] border placeholder:text-[#8F8F8F] border-[#727272] placeholder:text-sm" >
                </div>
                <div class="mb-12">
                    <label class="label" for="ConfirmNewPassword">confirm password</label>
                    <input id="ConfirmNewPassword" type="text" class="w-full rounded-[30px] pl-[29px] pt-[17px] pb-[18px] border placeholder:text-[#8F8F8F] border-[#727272] placeholder:text-sm" >
                </div>
            </div> 
            <!--todo send button  -->
            <button type="submit" class="text-white text-center py-[15px] bg-gradient-to-r from-[#8B302D] to-[#3A2625] w-full rounded-[30px] capitalize cursor-pointer">send</button>
        </form>
      </main>
</body>
</html>
