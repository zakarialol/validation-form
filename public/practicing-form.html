<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../build/input.css">
    <title>validation of the form</title>
</head>
<body class="content-center min-h-dvh">
    <form id="registerForm" action="">
            <div class="p-4 mx-auto space-y-4 w-fit box-shadow">
                <p class="text-2xl text-center text-yellow-600 uppercase">registred form</p>
                <div class="gridSplit">
                    <!-- lable -->
                    <label class="labelStyle" for="name">first name</label>
                    <!-- linput -->
                     <div class="relative">
                         <input id="firstName" name="firstName" class="w-full border" type="text" required name="" id="name">
                         <!-- svg div -->
                         <div data-valid="firstName" class="absolute hidden w-4 h-4 bg-white -top-2 -right-1">

                                    <g id="add" fill="red" transform="translate(42.666667, 42.666667)">

                            </svg>
                         </div>
                     </div>
                </div>
                <div class="gridSplit" >
                    <!-- label -->
                    <label class ="labelStyle" for="last-name">last name</label>
                    <!-- linput -->
                     <div class="relative">
                         <input class="w-full border" name="lastName" type="text" name="" id="last-name">
                        <div data-valid="lastName" class="absolute hidden w-4 h-4 bg-white -top-2 -right-1">    
                            <svg class="hidden" id="LNameFalsesvg" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                                <title>error-filled</title>
                                <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                                    <g id="add" fill="red" transform="translate(42.666667, 42.666667)">
                                        <path d="M213.333333,3.55271368e-14 C331.136,3.55271368e-14 426.666667,95.5306667 426.666667,213.333333 C426.666667,331.136 331.136,426.666667 213.333333,426.666667 C95.5306667,426.666667 3.55271368e-14,331.136 3.55271368e-14,213.333333 C3.55271368e-14,95.5306667 95.5306667,3.55271368e-14 213.333333,3.55271368e-14 Z M262.250667,134.250667 L213.333333,183.168 L164.416,134.250667 L134.250667,164.416 L183.168,213.333333 L134.250667,262.250667 L164.416,292.416 L213.333333,243.498667 L262.250667,292.416 L292.416,262.250667 L243.498667,213.333333 L292.416,164.416 L262.250667,134.250667 Z" id="Combined-Shape">

                            </svg>
                         </div>
                     </div>
                </div>

                <div class="gridSplit" >
                    <!-- lable -->
                    <label class ="labelStyle" for="password">password</label>
                    <!-- input -->
                    <input class="border" type="text" name="" id="password">
                </div>

                <div class="gridSplit">
                    <!-- label -->
                    <label class ="labelStyle" for="confirm-pass">confirm password</label>
                    <!-- input -->
                    <input class="border" type="text" name="" id="confirm-pass">
                </div>

                <div class="gridSplit">
                    <label class ="labelStyle" for="select">gender</label>
                    <select class="border" name="" id="select">
                        <option class ="labelStyle" value="">male</option>
                        <option class ="labelStyle" value="">female</option>
                    </select>
                </div>

                <div class="gridSplit" >
                    <label class = "labelStyle" for="" >choose a language</label>
                        <div class="flex justify-between" >
                            <div>
                                <!-- input -->
                                <input class="mr-1"   type="radio" value="css" name="skill" id="radio1">
                                <!-- label -->
                                <label class = "labelStyle" for="radio1" >css</label>
                            </div>
                            <div>
                                <!-- input -->
                                <input class="mr-1" value="HTML" type="radio" name="skill" id="radio2">
                                <!-- label -->
                                <label class = "labelStyle" for="radio2" >html</label>
                            </div>
                        </div>  
                </div>
                <div class="gridSplit">
                    <!-- label -->
                    <label class ="labelStyle" for="email">email</label>
                    <!-- input -->
                    <input class="border" type="text" name="" id="email">
                </div>

                <div class="gridSplit">
                    <!-- label -->
                    <label class ="labelStyle" for="phone">phone number</label>
                    <!-- input -->
                    <input class="border" type="text" name="" id="phone">
                </div>

                <div class="gridSplit">
                    <!-- label -->
                    <label class ="labelStyle"  for="address">address</label>
                    <!-- textarea -->
                    <textarea class="border" rows="4" style="resize: none;" name="" id="address"  rows="12"></textarea>
                </div>
                <div  class="gridSplit">
                    <!-- label -->
                    <label class="labelStyle" for="postal-code">postal-code</label>
                    <!-- input -->
                    <input class="border" type="text" name="" id="postal-code">
                </div>
                <div >
                    <!-- checkbox -->
                    <input class="border" class="labelStyle" type="checkbox" name="" id="agreedCheckBox">
                    <!-- label -->
                    <label class="labelStyle" for="">agreed to terms and conditions</label>
                </div>

                <div>
                    <button class="w-full py-1 text-lg font-bold text-yellow-900 capitalize bg-gray-200 opacity-40" type="submit" id="registerBtn"  disabled>sign up</button>
                </div>
            </div>
    </form>
    <script type="module" src="forms.js"></script>
</body>
</html>
