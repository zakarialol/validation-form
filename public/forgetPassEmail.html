            </div>
            <div class="text-[14px] text-center text-[#ABABAB] mt-[14px] mb-8 ">
                <a href="./login.html" class="cursor-pointer">back to sign in</a>
            </div>
            <!--todo send button  -->
            <button type="submit" class="text-white text-center py-[15px] bg-gradient-to-r from-[#8B302D] to-[#3A2625] w-full rounded-[30px] capitalize cursor-pointer">send</button>
