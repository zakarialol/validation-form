<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="../build/input.css">
</head>
<body>
    <!-- todo main background -->
    <main  class="h-dvh w-dvw bg-[url(../svgs/formbackground.png)] bg-center bg-no-repeat bg-cover content-center">
        <!-- todo background -->
        <div class="w-full h-[95%] bg-[url(../svgs/leaves.png)] bg-no-repeat bg-center bg-cover mx-auto flex items-center justify-center">
            <!--todo ling form  -->
            <div class="border p-4 border-white mx-auto w-[90%] bg-opacity-25 bg-white relative rounded-[31px] box-shadow backdrop-blur-sm">
                <img class="leaf-style -top-8" src="../svgs/leaf_03 1@2x.png" alt="">
                <img class="leaf-style top-1/4 -right-[20px]" src="../svgs/leaf_04 1.png" alt="">
                <p class="text-center capitalize font-semibold text-[#8B302D] text-2xl mb-4">sign up</p>
                <!-- form element  -->
                <form action="" class="space-y-4">
                    <div class="w-full">
                        <input type="text" class="w-full" placeholder="username or email">
                    </div>
                    <div class="w-full">
                        <input type="text" class="w-full" placeholder="password">
                    </div>
                    <button type="submit" class="font-semibold text-white w-full bg-[#8D2C22]">login</button>
                    <div class="flex items-center justify-between">
                        <p class="smallText">forget password</p>
                        <p class="smallText">sign up</p>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
