<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="icon" href="./svgs/leaf_03 1@2x.png">
    <link rel="stylesheet" href="./build/input.css">
</head>

<body class="md:heightFull">
    <!-- todo main background -->
    <main
        class="h-dvh w-dvw bg-[url(../svgs/formbackground.png)] bg-center bg-no-repeat bg-cover content-center md:widthAndBorder md:h-[500px] md:bg-none md:border-none">
        <!-- todo background -->
        <div class="w-full h-[95%] bg-no-repeat bg-center bg-cover mx-auto flex items-center justify-center">
            <!--todo form  -->
            <div
                class="border p-10 border-white mx-auto w-[90%] bg-opacity-25 bg-white relative rounded-[31px] box-shadow backdrop-blur-sm">
                <!--* leaf 1 -->
                <img class="leaf-style -top-[10px]" src="./svgs/leaf_03 1@2x.png" alt="">
                <!--* leaf 2 -->
                <img class="leaf-style top-1/4 -right-3" src="./svgs/leaf_04 1.png" alt="">
                <p class="text-center capitalize font-semibold text-[#8B302D] text-2xl mb-10">sign up</p>
                <div class="mb-4 text-xs text-red-500 msgTransition" id="signUpErrorHolder">
                    <p id="signUpErrorMsg">
                        username or password ain't correct
                    </p>
                </div>
                <!-- form element  -->
                <form data-form="login-form" action="" class="">
                    <div class="w-full mb-4">
                        <input data-input="loginUser" type="text" class="w-full inputStyle md:border"
                            placeholder="username or email">
                    </div>
                    <div id="loginPasswordDiv"  class="relative w-full mb-4">
                        <input data-input="password" type="password" class="w-full inputStyle md:border"
                            placeholder="password">
                        <img src="./svgs/leaf_04 2.png" class="absolute -bottom-1 -right-2 leaf-style" alt="" srcset="">
                        <button type="button" data-btn="viewPassword"
                            class="hidden absolute w-4 h-4 -translate-y-1/2 bg-transparent outline-none right-[2px] realtive top-1/2 cursor-pointer">
                            <svg class="hidden" id="viewPasswordSvg" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="3.5" stroke="#222222" />
                                <path d="M21 12C21 12 20 4 12 4C4 4 3 12 3 12" stroke="#222222" />
                            </svg>
                            <svg class="" id="inviewPasswordSvg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"
                                stroke-linejoin="miter">
                                <path d="M9.14,9a4,4,0,0,0,5.65,5.65Z" fill="#059cf7" opacity="0.1" stroke-width="0">
                                </path>
                                <path
                                    d="M17.86,18.14l-.44.32-.48.29-.51.27c-.17.08-.35.17-.54.24l-.56.22-.6.18-.63.14-.67.11-.7.07L12,20l-.73,0-.7-.07L9.9,19.8l-.63-.14-.6-.18-.56-.22c-.19-.07-.37-.16-.54-.24l-.51-.27-.48-.29-.44-.32a4.46,4.46,0,0,1-.43-.33l-.39-.34L5,17.11l-.34-.36c-.11-.13-.22-.25-.32-.38L4,16l-.27-.37-.25-.38c-.08-.12-.15-.24-.22-.36l-.21-.36-.18-.34-.16-.33-.15-.32-.12-.29c0-.09-.08-.18-.11-.27l-.09-.24c0-.08-.06-.15-.08-.22l-.06-.18a1,1,0,0,1,0-.14.76.76,0,0,1,0-.11V12l0-.07a.76.76,0,0,1,0-.11l.06-.14.08-.18c0-.07.07-.14.1-.22L2.44,11c0-.09.09-.18.14-.27l.15-.29.18-.32C3,10,3,9.93,3.1,9.81l.22-.34c.07-.12.15-.24.23-.36l.26-.36c.08-.13.18-.25.27-.38L4.37,8l.32-.37L5,7.25l.35-.36.38-.36.4-.34">
                                </path>
                                <path
                                    d="M10.14,4.2l.59-.11L11.36,4,12,4l.64,0,.63.07.59.11.58.14.55.18.53.22c.17.07.34.16.51.24l.49.27.46.29.44.32.42.33.4.34.38.36.35.36.34.38c.11.12.21.24.31.37s.2.25.3.37.19.25.27.38l.26.36c.08.12.16.24.23.36l.22.34c.06.12.13.23.19.33l.18.32.15.29c0,.09.1.18.14.27l.12.24c0,.08.07.15.1.22l.08.18.06.14a.76.76,0,0,1,0,.11L22,12v.11a.76.76,0,0,1,0,.11,1,1,0,0,1,0,.14l-.06.18c0,.07-.05.14-.08.22s-.06.16-.09.24-.07.18-.11.27l-.12.29-.15.32-.16.33-.18.34-.21.36">
                                </path>
                                <path d="M14.83,14.83A4,4,0,0,1,9.17,9.17"></path>
                                <line x1="2" y1="2" x2="22" y2="22"></line>
                            </svg>
                        </button>
                    </div>
                    <div>
                        <button id="loginButton"
                            class=" inputStyle font-semibold flex items-center gap-2 text-white w-full justify-center bg-[#8D2C22]"
                            type="submit">login</button>
                    </div>
                    <div class="flex items-center justify-between mt-10">
                        <a href="./forgetPassEmail.html" class="smallText">forget password</a>
                        <a href="./signupForm.html" class="smallText">sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script type="module" src="./login.js"></script>
</body>

</html>
